projects:
  - name: Caden
    stack: [Rust]
    url: https://github.com/ivanx000/caden-rs
    description: >
      A WebAuthn relying-party library in Rust implementing the W3C WebAuthn Level 3 spec
      from scratch — server-side ceremony verification for both registration and authentication,
      supporting ES256, ES384, EdDSA, and RS256 across six attestation formats.
      Ships with 297+ tests, fuzz targets, a no-panic guarantee (#![deny(clippy::unwrap_used)]),
      and #![forbid(unsafe_code)] enforced at compile time.
    tags: [cryptography, systems, security, webauthn, rust]

  - name: EvalForge
    stack: [TypeScript, Node.js]
    url: https://github.com/ivanx000/evals
    description: >
      A pytest-style CLI framework for benchmarking LLMs across custom YAML-defined test suites.
      Supports Anthropic, OpenAI, Gemini, and Ollama; grades outputs with deterministic criteria
      (exact match, regex, word count, code execution) or an LLM-as-judge; includes a web
      dashboard for run history and regression diffing; SHA-256 semantic cache eliminates
      redundant API calls across runs.
    tags: [llm-eval, cli, devtools, ai]

  - name: ShopOut
    stack: [Next.js, React, FastAPI, Python, SQLite, Gemini API]
    url: https://github.com/ivanx000/ShopOut
    description: >
      UofTHacks 13 project (deployed at shopout.vercel.app) — describe your vibe or identity
      and the AI assembles a shopping cart for you. Uses FastAPI + Gemini with RAG to map
      natural-language descriptions to product recommendations; Next.js/Tailwind frontend;
      SQLite persistent memory to refine suggestions over time.
    tags: [hackathon, fullstack, ai, rag, 3d]

  - name: Sleepi
    stack: [React, Vite, FastAPI, Python, Gemini API, ElevenLabs, LangChain]
    url: https://github.com/ry-cha/sleepi
    description: >
      Hack Western 12 project — a wellness platform for personalized sleep coaching.
      LangChain + Gemini pipeline generates insights from biometric data; React/Vite
      frontend renders real-time dashboards; FastAPI + ElevenLabs synthesizes coaching
      responses as voice audio.
    tags: [hackathon, wellness, ai, voice, fullstack]

  - name: Parker
    stack: [React Native, Expo, TypeScript, Google Maps API]
    url: https://github.com/ivanx000/Parker
    description: >
      A React Native mobile app that records where you parked and navigates you back.
      Uses Expo Location for high-precision GPS with background permissions and battery
      optimization, Google Maps API for navigation, and AsyncStorage for persistent data.
    tags: [mobile, gps, ios, android]

  - name: MWE Minecraft Mod
    stack: [Java, Forge API, Hypixel API, OpenGL, Gradle]
    url: https://github.com/Alexdoru/MWE
    description: >
      Open-source Minecraft PVP mod with 130k+ downloads. Contributed Java bytecode
      manipulation to dynamically patch internal game classes at runtime, and built
      custom OpenGL pipelines to visualize hitboxes and vector directions; integrates
      Hypixel API for real-time cheat detection.
    tags: [open-source, java, gamedev, opengl]

  - name: Polymarket Trading Bot
    stack: [Python, Rust, Docker, AWS EC2]
    description: >
      A live algorithmic trading bot placing orders on Polymarket via their API, deployed
      on AWS EC2 via Docker Compose. Debugged production issues including SDK migrations,
      auth/signature mismatches, and wallet config for reliable live order execution.
    tags: [trading, systems, live-production, infrastructure]

